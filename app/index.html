<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY AI PASSPORT™ — Authenticated Learner Workspace</title>
  <meta name="description" content="Lifelong digital identity and capability workspace for practical AI building.">
  
  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <style>
    /* ==========================================================================
       MY AI PASSPORT™ — AUTHENTICATED WORKSPACE SHELL
       ========================================================================== */
    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Sidebar Navigation */
    .app-sidebar {
      width: 260px;
      background: rgba(10, 10, 10, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      box-sizing: border-box;
      z-index: 10;
    }

    .sidebar-brand {
      padding: 0 12px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sidebar-logo {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--color-gold);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Primary Nav Links */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 24px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-item.active {
      color: var(--color-gold);
      background: rgba(223, 207, 173, 0.12);
      border: 1px solid rgba(223, 207, 173, 0.25);
      font-weight: 600;
    }

    .nav-icon {
      font-size: 1.05rem;
      width: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.2s ease;
    }
    .nav-item.active .nav-icon {
      color: var(--color-gold);
    }

    /* App Main Layout Body */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    /* Top Header */
    .app-topbar {
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 32px;
      background: rgba(8, 8, 8, 0.8);
      backdrop-filter: blur(16px);
      box-sizing: border-box;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-menu-wrap {
      position: relative;
    }

    .user-avatar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 12px 4px 4px;
      border-radius: 20px;
      cursor: pointer;
      color: #ffffff;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .user-avatar-btn:hover {
      border-color: rgba(223, 207, 173, 0.4);
    }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-gold);
      color: #000000;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .user-dropdown {
      position: absolute;
      top: 48px;
      right: 0;
      width: 220px;
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      display: none;
      z-index: 100;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }

    /* Content Area Scroll Container */
    .app-content {
      flex: 1;
      padding: 32px 36px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Base Layout Wrappers */
    .overview-wrapper, .passport-page-wrapper, .learn-page-wrapper, .projects-page-wrapper, .project-detail-wrapper, .credentials-page-wrapper, .credential-detail-wrapper, .capability-page-wrapper {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .overview-section, .passport-section, .learn-section, .projects-section, .credentials-section, .capability-section {
      width: 100%;
    }

    /* Hero Styling */
    .greeting-tag, .hero-tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--color-gold);
      margin-bottom: 4px;
    }
    .greeting-title, .hero-title {
      font-family: var(--font-serif);
      font-size: 1.95rem;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .greeting-sub, .hero-sub {
      color: var(--color-text-secondary);
      font-size: 0.88rem;
      margin: 0;
    }

    /* Buttons */
    .btn-passport-cta, .btn-primary-action {
      background: var(--color-gold);
      color: #000000;
      padding: 9px 18px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-passport-cta:hover, .btn-primary-action:hover {
      background: #ffffff;
      color: #000000;
    }
    .btn-passport-secondary, .btn-secondary-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn-passport-secondary:hover, .btn-secondary-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(223, 207, 173, 0.4);
      color: var(--color-gold);
    }
    .btn-text-link {
      background: transparent;
      border: none;
      color: var(--color-gold);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .full-width { width: 100%; text-align: center; }

    /* Section Headers */
    .section-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 4px 0;
    }
    .section-subtitle {
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      margin: 0;
    }
    .margin-bot-16 { margin-bottom: 16px; }
    .margin-top-16 { margin-top: 16px; }

    /* ==========================================================================
       STAGE 7 CAPABILITY SPECIFIC STYLES
       ========================================================================== */
    .capability-profile-summary {
      background: rgba(12, 12, 12, 0.95);
      border: 1px solid rgba(223, 207, 173, 0.25);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .summary-item { display: flex; flex-direction: column; align-items: center; }
    .sum-lbl { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--color-gold); letter-spacing: 0.1em; }
    .sum-val { font-size: 0.95rem; font-weight: 700; color: #ffffff; }
    .summary-divider { color: rgba(255, 255, 255, 0.15); }

    .capability-workspace-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }
    .capability-matrix-container {
      background: rgba(13, 13, 13, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .matrix-header { display: flex; flex-direction: column; gap: 2px; }
    .matrix-title { font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; color: var(--color-gold); letter-spacing: 0.15em; }
    .matrix-sub { font-size: 0.78rem; color: var(--color-text-secondary); }

    .capability-tracks-list { display: flex; flex-direction: column; gap: 10px; }
    .capability-track-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .capability-track-card:hover, .track-selected {
      border-color: rgba(223, 207, 173, 0.5);
      background: rgba(223, 207, 173, 0.04);
    }
    .track-left { display: flex; flex-direction: column; gap: 2px; }
    .track-dim-name { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 700; color: #ffffff; margin: 0; }
    .track-ev-count { font-size: 0.72rem; color: var(--color-text-secondary); }

    .track-right-pipeline { display: flex; align-items: center; gap: 4px; }
    .pipeline-node-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; width: 58px; }
    .node-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.2s ease; }
    .node-passed .node-dot { background: rgba(223, 207, 173, 0.4); }
    .node-active .node-dot { background: var(--color-gold); box-shadow: 0 0 12px rgba(223, 207, 173, 0.8); transform: scale(1.2); }
    .node-label { font-family: 'Space Mono', monospace; font-size: 0.52rem; color: var(--color-text-secondary); text-align: center; }
    .node-active .node-label { color: var(--color-gold); font-weight: 700; }
    .pipeline-connector { height: 1px; width: 14px; background: rgba(255, 255, 255, 0.1); margin-top: -12px; }

    /* Dimension Detail Drawer */
    .dim-detail-wrapper {
      background: rgba(13, 13, 13, 0.95);
      border: 1px solid rgba(223, 207, 173, 0.3);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .dim-tag { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--color-gold); letter-spacing: 0.15em; }
    .dim-title { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700; color: #ffffff; margin: 2px 0; }
    .dim-desc { font-size: 0.82rem; color: var(--color-text-secondary); margin: 0; line-height: 1.35; }

    .current-state-badge-row { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; }
    .state-label { font-family: 'Space Mono', monospace; color: var(--color-text-secondary); font-size: 0.62rem; }
    .state-pill { font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 6px; }
    .state-explore { background: rgba(255, 255, 255, 0.08); color: var(--color-text-secondary); }
    .state-develop { background: rgba(223, 207, 173, 0.12); color: var(--color-gold); border: 1px solid rgba(223, 207, 173, 0.3); }
    .state-demonstrate { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .state-advance { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; }
    .state-explanation-text { font-size: 0.8rem; color: #ffffff; margin: 6px 0 0 0; background: rgba(255, 255, 255, 0.02); padding: 8px 10px; border-radius: 6px; }

    .evidence-item-list, .mapped-projects-list, .learning-signals-list, .related-creds-list { display: flex; flex-direction: column; gap: 6px; }
    .evidence-row, .mapped-proj-card, .signal-row, .rel-cred-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 10px; border-radius: 6px; font-size: 0.78rem;
    }
    .ev-chip { font-family: 'Space Mono', monospace; font-size: 0.58rem; color: var(--color-gold); }
    .ev-link, .proj-name, .signal-name, .rel-cred-title { color: #ffffff; }
    .ev-status { font-size: 0.65rem; color: #00ff88; }
    .pending-evidence-box { background: rgba(255, 255, 255, 0.02); padding: 8px 10px; border-radius: 6px; font-size: 0.74rem; }
    .pending-lbl { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--color-gold); }
    .pending-sub-item { color: var(--color-text-secondary); font-size: 0.72rem; }

    /* Next Frontier Box */
    .next-frontier-box {
      background: rgba(223, 207, 173, 0.04);
      border: 1px solid rgba(223, 207, 173, 0.25);
      border-radius: 10px;
      padding: 14px;
    }
    .frontier-tag { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--color-gold); letter-spacing: 0.15em; }
    .frontier-title { font-family: var(--font-serif); font-size: 1rem; color: #ffffff; margin: 2px 0 6px 0; }
    .frontier-text { font-size: 0.8rem; color: var(--color-text-secondary); margin: 0; line-height: 1.4; }

    /* How Capability Works Section */
    .how-capability-card {
      background: rgba(12, 12, 12, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 24px;
    }
    .how-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .how-col { background: rgba(255, 255, 255, 0.02); border-left: 2px solid var(--color-gold); padding: 12px 14px; border-radius: 6px; }
    .how-step-num { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--color-gold); font-weight: 700; }
    .how-col h4 { font-family: var(--font-sans); font-size: 0.82rem; font-weight: 700; color: #ffffff; margin: 4px 0; }
    .how-col p { font-size: 0.74rem; color: var(--color-text-secondary); margin: 0; line-height: 1.35; }

    /* Responsive grid adjustments */
    @media (max-width: 1100px) {
      .capability-workspace-grid { grid-template-columns: 1fr; }
      .how-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .app-sidebar { display: none; }
      .app-main { width: 100%; }
      .app-content { padding: 20px 16px; }
      .hero-title { font-size: 1.55rem; }
      .how-grid { grid-template-columns: 1fr; }
      .capability-track-card { flex-direction: column; align-items: flex-start; gap: 12px; }
      .track-right-pipeline { width: 100%; justify-content: space-between; }
      .pipeline-node-wrap { width: auto; }
      .pipeline-connector { flex: 1; }
    }
  </style>
</head>

        <button class="nav-item" onclick="switchView('learn', this)">

        </button>
        <button class="nav-item" id="nav-item-reviewer" onclick="switchView('reviewer', this)" style="display:none;" data-stage9-gate="true">

      <div>Don't Just Learn. Build.</div>

  <!-- Main Content Workspace -->
  <main class="app-main">
    
    <!-- Topbar Header -->
    <header class="app-topbar">
      <div class="topbar-right">
        <div class="user-menu-wrap">
          <button class="user-avatar-btn" onclick="toggleUserDropdown()">
            <div class="avatar-circle" id="user-avatar-initials">VB</div>

          </button>

          <div class="user-dropdown" id="user-dropdown">
            <a class="dropdown-item" onclick="switchView('settings')">Profile & Settings</a>
            <a class="dropdown-item" id="link-public-preview" href="../passport.html" target="_blank">Public Passport Preview</a>

    <!-- Main Workspace Container -->
    <div class="app-content">

      <!-- View 1: Overview -->
      <div id="view-overview" class="view-panel"></div>

      <!-- View 7: Settings -->
      <div id="view-settings" class="view-panel" style="display: none;">
        <div class="empty-section-box">
          <h2 class="empty-title">PROFILE & PRIVACY SETTINGS</h2>
          <p class="empty-desc">Manage account options, public handle, bio, and privacy settings.</p>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { getCurrentUser, getLearnerProfile, getPassportCard, ensureLearnerProvisioned, supabase, isSupabaseConfigured } from '../src/lib/supabase.js';
    import { renderOverview } from '../src/app/overview.js';
    import { renderPassportPage } from '../src/app/passport.js';
    import { renderLearnPage } from '../src/app/learn.js';
    import { renderProjectsPage } from '../src/app/projects.js';
    import { renderCredentialsPage } from '../src/app/credentials.js';
    import { renderCapabilityPage } from '../src/app/capability.js';
    import { initReviewerConsole } from '../src/app/reviewer.js';

    let currentUserSession = null;

    initUserSession();

    async function initUserSession() {
      if (!isSupabaseConfigured) {
        window.location.href = '../login.html';
        return;
      }

      let user = await getCurrentUser();
      
      if (!user) {
        window.location.href = '../login.html';
        return;
      }

      currentUserSession = user;

      // Auto-provision default records (passport card, capability states, etc.) if missing (non-blocking)
      ensureLearnerProvisioned(user).catch(() => {});

      let profile = null;
      try {
        profile = await getLearnerProfile(user.id);
      } catch (err) {}

      const name = profile?.full_name || user.user_metadata?.full_name || formatEmailName(user.email);
      const initials = name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
      
      document.getElementById('user-avatar-initials').textContent = initials || 'VB';
      document.getElementById('user-display-name').textContent = name;

      // Initial Render based on URL view param or default Overview
      const urlParams = new URLSearchParams(window.location.search);
      const requestedView = urlParams.get('view') || 'overview';
      const targetId = urlParams.get('id') || urlParams.get('dim');
      await window.switchView(requestedView, null, targetId);
    }

    function formatEmailName(emailStr) {
      if (!emailStr) return 'Builder';
      const handle = emailStr.split('@')[0];
      return handle.charAt(0).toUpperCase() + handle.slice(1);
    }

    window.switchView = async function(viewId, btnElement, targetId = null) {
      document.querySelectorAll('.view-panel').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      const targetPanel = document.getElementById(`view-${viewId}`);
      if (targetPanel) targetPanel.style.display = 'block';

      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const matchNav = Array.from(document.querySelectorAll('.nav-item')).find(el => el.getAttribute('onclick')?.includes(viewId));
        if (matchNav) matchNav.classList.add('active');
      }

      // Dynamic view renderers
      if (viewId === 'overview' && targetPanel && currentUserSession) {
        await renderOverview(targetPanel, currentUserSession);
      } else if (viewId === 'passport' && targetPanel && currentUserSession) {
        await renderPassportPage(targetPanel, currentUserSession);
      } else if (viewId === 'learn' && targetPanel && currentUserSession) {
        await renderLearnPage(targetPanel, currentUserSession);
      } else if (viewId === 'projects' && targetPanel && currentUserSession) {
        await renderProjectsPage(targetPanel, currentUserSession, targetId);
      } else if (viewId === 'credentials' && targetPanel && currentUserSession) {
        await renderCredentialsPage(targetPanel, currentUserSession, targetId);
      } else if (viewId === 'capability' && targetPanel && currentUserSession) {
        await renderCapabilityPage(targetPanel, currentUserSession, targetId);
      } else if (viewId === 'reviewer' && targetPanel) {
        targetPanel.innerHTML = '<div style="max-width:700px;margin:80px auto;padding:40px;background:rgba(18,20,26,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:12px;text-align:center;"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#d4af37;margin-bottom:16px;">STAGE 9 — GOVERNANCE & AUTHORITY</div><h2 style="font-size:24px;font-weight:800;color:#ffffff;margin:0 0 12px;">GOVERNANCE CONSOLE</h2><p style="color:rgba(255,255,255,0.5);font-size:14px;margin:0 0 24px;line-height:1.6;">The Reviewer &amp; Authority Governance Console is being prepared for activation.<br>Evidence verification, capability recognition, and credential issuance will be available here.</p><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#d4af37;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.2);padding:12px 20px;border-radius:6px;display:inline-block;">COMING SOON</div></div>';
      }

      document.getElementById('user-dropdown').style.display = 'none';
    };

    window.toggleUserDropdown = function() {
      const dd = document.getElementById('user-dropdown');
      dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
    };

    window.handleSignOut = async function() {
      try {
        await supabase.auth.signOut();
      } catch(e){}
      window.location.href = '../login.html';
    };
  </script>
</body>
</html>
