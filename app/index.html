<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY AI PASSPORT™ — Authenticated Learner Workspace</title>
  <meta name="description" content="Lifelong digital identity and capability workspace for practical AI building.">
  
  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <style>
    /* ==========================================================================
       MY AI PASSPORT™ — AUTHENTICATED WORKSPACE SHELL
       ========================================================================== */
    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Sidebar Navigation */
    .app-sidebar {
      width: 260px;
      background: rgba(10, 10, 10, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      box-sizing: border-box;
      z-index: 10;
    }

    .sidebar-brand {
      padding: 0 12px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sidebar-logo {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--color-gold);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Primary Nav Links */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 24px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-item.active {
      color: var(--color-gold);
      background: rgba(223, 207, 173, 0.12);
      border: 1px solid rgba(223, 207, 173, 0.25);
      font-weight: 600;
    }

    .nav-icon {
      font-size: 1.05rem;
      width: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.2s ease;
    }
    .nav-item.active .nav-icon {
      color: var(--color-gold);
    }

    /* App Main Layout Body */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    /* Top Header */
    .app-topbar {
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 32px;
      background: rgba(8, 8, 8, 0.8);
      backdrop-filter: blur(16px);
      box-sizing: border-box;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-menu-wrap {
      position: relative;
    }

    .user-avatar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 12px 4px 4px;
      border-radius: 20px;
      cursor: pointer;
      color: #ffffff;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .user-avatar-btn:hover {
      border-color: rgba(223, 207, 173, 0.4);
    }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-gold);
      color: #000000;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .user-dropdown {
      position: absolute;
      top: 48px;
      right: 0;
      width: 220px;
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      display: none;
      z-index: 100;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }

    /* Content Area Scroll Container */
    .app-content {
      flex: 1;
      padding: 32px 36px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Base Layout Wrappers */
    .overview-wrapper, .passport-page-wrapper, .learn-page-wrapper, .projects-page-wrapper, .project-detail-wrapper, .credentials-page-wrapper, .credential-detail-wrapper, .capability-page-wrapper {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .overview-section, .passport-section, .learn-section, .projects-section, .credentials-section, .capability-section {
      width: 100%;
    }

    /* ==========================================================================
       DIGITAL PASSPORT CARD & OVERVIEW CARDS (PREMIUM GLASSMORPHISM & GOLD)
       ========================================================================== */
    .digital-passport-card {
      position: relative;
      background: linear-gradient(135deg, rgba(20, 20, 24, 0.95) 0%, rgba(10, 10, 12, 0.98) 100%);
      border: 1px solid rgba(223, 207, 173, 0.35);
      border-radius: 18px;
      padding: 32px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 30px rgba(223, 207, 173, 0.08);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .passport-card-flare {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(223, 207, 173, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .passport-security-watermark {
      position: absolute;
      bottom: 8px;
      right: 16px;
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.25em;
      color: rgba(223, 207, 173, 0.15);
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    .passport-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .passport-brand-tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--color-gold);
    }

    .passport-status-pill {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .status-active-pill {
      background: rgba(0, 255, 136, 0.12);
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, 0.35);
    }

    .status-pending-pill {
      background: rgba(255, 170, 0, 0.12);
      color: #ffaa00;
      border: 1px solid rgba(255, 170, 0, 0.35);
    }

    .passport-card-body {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .passport-avatar-box {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(223, 207, 173, 0.25) 0%, rgba(223, 207, 173, 0.05) 100%);
      border: 2px solid rgba(223, 207, 173, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .passport-avatar-initials {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--color-gold);
      text-shadow: 0 0 12px rgba(223, 207, 173, 0.5);
    }

    .passport-details-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .passport-user-name {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .passport-user-handle {
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      color: var(--color-gold);
      opacity: 0.9;
    }

    .passport-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meta-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    .meta-value {
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
    }

    .passport-id-mono {
      font-family: 'Space Mono', monospace;
      color: var(--color-gold);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .passport-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }

    .passport-credibility-text {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      max-width: 450px;
      line-height: 1.4;
    }

    .passport-action-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .build-passport-container {
      background: rgba(12, 12, 12, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 24px;
    }

    /* ==========================================================================
       OVERVIEW & WORKSPACE CARDS (1000X LUXURY DESIGN SYSTEM)
       ========================================================================== */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    .three-col-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .overview-card {
      background: rgba(14, 15, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .overview-card:hover {
      border-color: rgba(223, 207, 173, 0.35);
      transform: translateY(-4px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.7), 0 0 20px rgba(223, 207, 173, 0.06);
    }

    .primary-card {
      border-top: 3px solid var(--color-gold);
    }

    .advisory-card {
      border-top: 3px solid rgba(0, 255, 136, 0.6);
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card-section-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--color-gold);
      text-transform: uppercase;
    }

    .card-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }

    .dimension-badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(223, 207, 173, 0.1);
      color: var(--color-gold);
      border: 1px solid rgba(223, 207, 173, 0.25);
    }

    .next-move-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .next-move-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .next-move-desc {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      margin: 0;
      line-height: 1.45;
    }

    .next-challenge-box {
      background: rgba(223, 207, 173, 0.05);
      border: 1px solid rgba(223, 207, 173, 0.2);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .challenge-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .challenge-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--color-gold);
    }

    .challenge-time {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
    }

    .challenge-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* Stats & Capability Overview Grid */
    .stats-overview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-card-box {
      background: rgba(14, 15, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .stat-card-box:hover {
      border-color: rgba(223, 207, 173, 0.3);
      transform: translateY(-2px);
    }

    .stat-number {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--color-gold);
      line-height: 1;
    }

    .stat-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    .stat-subtext {
      font-size: 0.76rem;
      color: var(--color-text-secondary);
    }

    /* Timeline & Activity */
    .journey-timeline-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      padding-left: 20px;
    }

    .journey-timeline-list::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: rgba(255, 255, 255, 0.08);
    }

    .journey-timeline-item {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .journey-marker {
      position: absolute;
      left: -20px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-gold);
      box-shadow: 0 0 10px var(--color-gold);
    }

    .journey-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      color: var(--color-gold);
    }

    .journey-event-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }

    .journey-event-desc {
      font-size: 0.78rem;
      color: var(--color-text-secondary);
      margin: 2px 0 0 0;
    }

    /* ==========================================================================
       ALL COMPONENT & TAB CARDS (239 UNSTYLED CLASSES COMPLETE MASTER STYLES)
       ========================================================================== */
    .overview-skeleton-wrapper {
      display: flex; flex-direction: column; gap: 20px; width: 100%;
    }
    .skeleton-box {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: skeletonPulse 1.8s infinite ease-in-out;
      border-radius: 12px;
    }
    @keyframes skeletonPulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .greeting-skeleton { height: 70px; }
    .passport-skeleton { height: 220px; }
    .card-skel { height: 180px; }

    .empty-section-box {
      background: rgba(15, 15, 18, 0.95);
      border: 1px dashed rgba(223, 207, 173, 0.3);
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 650px;
      margin: 40px auto;
    }
    .empty-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }
    .empty-desc {
      font-size: 0.88rem;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin: 0;
    }
    .inline-btn { margin-top: 8px; }

    .trust-info-banner {
      background: linear-gradient(135deg, rgba(223, 207, 173, 0.08) 0%, rgba(12, 12, 14, 0.95) 100%);
      border: 1px solid rgba(223, 207, 173, 0.25);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .banner-tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--color-gold);
      letter-spacing: 0.15em;
    }
    .banner-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin: 4px 0;
    }
    .banner-desc {
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      margin: 0;
      line-height: 1.4;
    }

    .user-credentials-grid, .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .credential-item-card, .how-credentials-card, .empty-credentials-card, .project-card {
      background: rgba(14, 15, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .credential-item-card:hover, .project-card:hover {
      border-color: rgba(223, 207, 173, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(223, 207, 173, 0.08);
    }

    .cred-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-type-chip {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--color-gold);
      background: rgba(223, 207, 173, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(223, 207, 173, 0.25);
      letter-spacing: 0.1em;
    }
    .cred-status-pill {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
    }
    .cred-card-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.25;
    }
    .cred-meta-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
    .meta-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    .meta-lbl {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }
    .monospace-id {
      font-family: 'Space Mono', monospace;
      color: var(--color-gold);
      font-weight: 700;
    }
    .cred-provenance-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.76rem;
      color: var(--color-text-secondary);
    }
    .prov-lbl {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      color: var(--color-gold);
    }
    .cred-card-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .card-btn { flex: 1; }

    .filter-controls-wrapper {
      background: rgba(14, 15, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 24px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-group-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
